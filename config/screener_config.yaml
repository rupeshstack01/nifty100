filters:
  min_roe: null
  max_de: null
  min_fcf: null
  max_pe: null
  max_pb: null
  min_pat_cagr_5yr: null
  min_dividend_yield_pct: null
  min_npm: null
  min_opm: null
  min_roce: null
  min_interest_coverage: null
  max_capex_intensity_pct: null
  min_revenue_cagr_5yr: null
  min_eps_cagr_5yr: null
