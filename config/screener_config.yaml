presets:
  quality:
    description: "ROE > 15%, D/E < 1, FCF > 0"
    source: "Project specification"
    filters:
      min_roe: 15
      max_de: 1
      min_fcf: 0

  value:
    description: "P/E < 20, P/B < 3"
    source: "Project specification"
    filters:
      max_pe: 20
      max_pb: 3

  growth:
    description: "PAT CAGR > 20% over 5 years"
    source: "Project specification"
    filters:
      min_pat_cagr_5yr: 20

  dividend:
    description: "Dividend Yield > 2%"
    source: "Project specification"
    filters:
      min_dividend_yield_pct: 2

  fcf_quality:
    description: "FCF > 1,000 Cr"
    source: "Engineering-defined Sprint 3 preset; threshold selected from 92-company dataset distribution"
    filters:
      min_fcf: 1000

  profitability:
    description: "NPM > 15%, OPM > 20%"
    source: "Engineering-defined Sprint 3 preset; threshold selected from 92-company dataset distribution"
    filters:
      min_npm: 15
      min_opm: 20
